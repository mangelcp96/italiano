<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Italiano</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Italiano">
<meta name="theme-color" content="#1f8a4c">
<script src="vocab.js"></script>
<script src="audio-map.js"></script>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e4e0d8;
    --green:#1f8a4c; --green-soft:#e3f3e9; --red:#c8352e; --red-soft:#fbe6e4;
    --amber:#b7791f; --amber-soft:#fbf0dc; --accent:#1f8a4c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181b; --card:#212429; --ink:#eceff3; --muted:#9aa1ab; --line:#33373e;
      --green-soft:#183526; --red-soft:#3a1d1b; --amber-soft:#3a2d15; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
  .wrap{max-width:620px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .locked{opacity:.55}
  .unlock{background:var(--green-soft);border:1px solid var(--green);}
  .update-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem}
  .update-bar button{background:var(--green);color:#fff;padding:8px 12px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:1.35rem;margin:0;display:flex;align-items:center;gap:8px}
  .flag{display:inline-flex;width:22px;height:15px;border-radius:2px;overflow:hidden}
  .flag i{flex:1}.flag i:nth-child(1){background:#1f8a4c}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#c8352e}
  button{font:inherit;cursor:pointer;border:none;border-radius:12px}
  .icon-btn{background:transparent;color:var(--muted);font-size:1.3rem;padding:6px 8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:1.4rem}
  .stat span{font-size:.78rem;color:var(--muted)}
  .primary{background:var(--accent);color:#fff;padding:14px;width:100%;font-weight:600;font-size:1rem;margin-bottom:18px}
  .primary:disabled{opacity:.5;cursor:default}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .sec-top{display:flex;align-items:center;gap:12px}
  .sec-ico{font-size:1.6rem;width:34px;text-align:center}
  .sec-name{font-weight:600}
  .sec-meta{font-size:.8rem;color:var(--muted);margin-top:2px}
  .bar{height:6px;background:var(--line);border-radius:4px;margin:10px 0 10px;overflow:hidden}
  .bar>div{height:100%;background:var(--green);border-radius:4px}
  .sec-btns{display:flex;gap:8px}
  .sec-btns button{flex:1;padding:9px;font-size:.88rem;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .sec-btns button.go{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:600}
  .due-pill{margin-left:auto;font-size:.75rem;font-weight:600;background:var(--amber-soft);color:var(--amber);padding:3px 9px;border-radius:20px;white-space:nowrap}
  /* session */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .topbar .bar{flex:1;margin:0}
  .counter{font-size:.85rem;color:var(--muted);white-space:nowrap}
  .flash{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:300px;padding:26px 20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;position:relative}
  .flash .tag{position:absolute;top:12px;left:14px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .flash .box{position:absolute;top:12px;right:14px;font-size:.72rem;color:var(--muted)}
  .front{font-size:2rem;font-weight:700;line-height:1.2}
  .hint{margin-top:16px;color:var(--muted);font-size:.85rem}
  .back{font-size:1.5rem;font-weight:600;color:var(--green);margin-top:14px}
  .ex{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);width:100%}
  .ex .it{font-style:italic}
  .ex .es{color:var(--muted);font-size:.9rem;margin-top:4px}
  .speak{margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:7px 14px;font-size:.9rem}
  .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .answers button{padding:14px 6px;font-weight:600;font-size:.95rem}
  .a-again{background:var(--red-soft);color:var(--red)}
  .a-good{background:var(--amber-soft);color:var(--amber)}
  .a-easy{background:var(--green-soft);color:var(--green)}
  .answers small{display:block;font-weight:400;font-size:.72rem;opacity:.8;margin-top:2px}
  .done{text-align:center;padding:40px 10px}
  .done .big{font-size:3rem}
  /* forms */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .panel h3{margin:0 0 10px;font-size:1rem}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border-radius:0;padding:9px 6px;background:var(--bg);color:var(--ink);font-size:.88rem}
  .seg button.on{background:var(--accent);color:#fff}
  .ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px 14px}
  .danger{background:var(--red-soft);color:var(--red);padding:10px 14px}
  .note{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.4}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .list-item:last-child{border-bottom:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .hidden{display:none!important}
  .pron-group{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
  .pron p{margin:0 0 10px;line-height:1.5;font-size:.93rem}
  .pron-ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pron-word{background:var(--bg);border:1px solid var(--line);color:var(--ink);text-align:left;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
  .pron-word:active{background:var(--green-soft)}
  .pw{font-weight:600}
  .pg{font-size:.82rem;color:var(--green);font-family:ui-monospace,Menlo,monospace}
  .pm{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* El vocabulario está en vocab.js y el mapa de audios en audio-map.js */
const APP_VERSION = "3.3";
const GROW_STEP = 10; // palabras que se añaden a una sección al verlas todas
if (typeof AUDIO_MAP === "undefined") window.AUDIO_MAP = {};

/* =========================================================
   ESTADO Y ALMACENAMIENTO (offline, en el navegador)
   ========================================================= */
const KEY = "flashcards_italiano_v1";
const DAY = 86400000;
const INTERVALS = [0, 0, 1, 3, 7, 16, 35]; // días por caja (1..6)
const MASTERED_BOX = 5;
let memStore = null;

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); }
  catch(e){ if (memStore) return memStore; }
  return memStore || {progress:{}, custom:[], settings:{dir:"it-es", newPerSession:20, v:2}, streak:{last:null,count:0}, unlocked:0};
}
function save(){
  memStore = S;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
let S = load();
S.progress ||= {}; S.custom ||= []; S.settings ||= {dir:"it-es", newPerSession:10};
S.settings.rate ||= 0.85; S.streak ||= {last:null,count:0}; S.visible ||= {};
if (!S.settings.v){ S.settings.newPerSession = 20; S.settings.v = 2; }
if (S.settings.audio === undefined) S.settings.audio = "rec"; // rec = audio grabado
let SECTIONS = [];
function visibleCount(s){ return Math.min(s.cards.length, S.visible[s.id] || s.start); }
function refreshSections(){ SECTIONS = BASE_SECTIONS.map(s => ({...s, total:s.cards.length, cards:s.cards.slice(0, visibleCount(s))})); }
refreshSections();
/* Cuando ya has visto todas las palabras visibles de una sección, se le añaden GROW_STEP más */
function growSections(){
  const grown = [];
  BASE_SECTIONS.forEach(s=>{
    const n = visibleCount(s); if (n >= s.cards.length) return;
    const anyNew = s.cards.slice(0, n).some(c => !S.progress[s.id+":"+c[0]]);
    if (!anyNew){ S.visible[s.id] = Math.min(s.cards.length, n + GROW_STEP); grown.push(s); }
  });
  if (grown.length){ save(); refreshSections();
    toast(grown.length===1 ? `+${GROW_STEP} palabras nuevas en ${grown[0].name}` : `+${GROW_STEP} palabras nuevas en ${grown.length} secciones`); }
  return grown;
}

function allCards(){
  const out = [];
  SECTIONS.forEach(sec => sec.cards.forEach(c => out.push({id:sec.id+":"+c[0], sec:sec.id, it:c[0], es:c[1], exIt:c[2]||"", exEs:c[3]||""})));
  S.custom.forEach(c => out.push(c));
  return out;
}
function cardsOf(secId){ return allCards().filter(c => secId==="all" || c.sec===secId); }
function isDue(c, now){ const p=S.progress[c.id]; return p && p.due <= now; }
function isNew(c){ return !S.progress[c.id]; }
function isMastered(c){ const p=S.progress[c.id]; return p && p.box >= MASTERED_BOX; }

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function bumpStreak(){
  const t = todayStr(); if (S.streak.last === t) return;
  const y = new Date(Date.now()-DAY); const ys = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  S.streak.count = (S.streak.last === ys) ? S.streak.count+1 : 1;
  S.streak.last = t;
}
function streakNow(){
  if (!S.streak.last) return 0;
  const t = todayStr(); const y = new Date(Date.now()-DAY); const ys = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  return (S.streak.last===t || S.streak.last===ys) ? S.streak.count : 0;
}

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
/* ---------- VOZ: elige la voz italiana más natural disponible ---------- */
let itVoices = [];
function voiceScore(v){
  const n = (v.name||"").toLowerCase(); let s = 0;
  if (/natural|neural|online/.test(n)) s += 50;          // Edge / Windows (muy naturales)
  if (/premium/.test(n)) s += 45;                         // macOS / iOS voces premium
  if (/enhanced|mejorad|migliorat/.test(n)) s += 40;      // macOS / iOS voces mejoradas
  if (/google/.test(n)) s += 30;                          // Chrome
  if (/elsa|isabella|diego|giuseppe|federica|alice|luca|paola|emma/.test(n)) s += 5;
  if (/it[-_]it/i.test(v.lang)) s += 3;
  if (/compact|espeak|eloquence/.test(n)) s -= 30;        // voces muy robóticas
  // voces "de efectos" de Apple (suenan raras o robóticas)
  if (/eddy|flo\b|grandma|grandpa|nonna|nonno|reed|rocko|sandy|shelley|bells|bubbles|cellos|organ|zarvox|trinoids|whisper|wobble|bad news|good news|jester|superstar|bahh|boing|albert|fred|junior|kathy|ralph/.test(n)) s -= 40;
  return s;
}
function loadVoices(){
  try{
    itVoices = speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang))
      .sort((a,b)=>voiceScore(b)-voiceScore(a));
  }catch(e){ itVoices = []; }
  if ($("#voice-sel")) renderSettings();
  else if ($(".stats")) renderHome();
}
if ("speechSynthesis" in window){
  loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
  // Safari en iPhone a veces no avisa cuando las voces están listas: reintenta
  [300, 1000, 2500, 5000].forEach(t => setTimeout(()=>{ if (!itVoices.length) loadVoices(); }, t));
}
function currentVoice(){
  const want = S.settings.voice;
  return itVoices.find(v=>v.voiceURI===want) || itVoices[0] || null;
}
const player = new Audio(); player.preload = "auto";
/* Mantiene despierta la salida de sonido del ordenador (Windows y algunos auriculares la
   "duermen" tras unos segundos de silencio y se come el principio de cada audio).
   Emite una señal inaudible mientras la app está visible. No se usa en iPhone/iPad. */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
let keepCtx = null, keepStarted = 0;
function keepAudioAwake(){
  if (IS_IOS) return;
  try{
    if (!keepCtx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      keepCtx = new AC();
      const osc = keepCtx.createOscillator(), g = keepCtx.createGain();
      osc.frequency.value = 20; g.gain.value = 0.0005;   // 20 Hz casi sin volumen: no se oye
      osc.connect(g).connect(keepCtx.destination); osc.start();
      keepStarted = Date.now();
    }
    if (keepCtx.state === "suspended"){ keepCtx.resume(); keepStarted = Date.now(); }
  }catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(ev => document.addEventListener(ev, keepAudioAwake, {capture:true, passive:true}));
document.addEventListener("visibilitychange", ()=>{
  if (!keepCtx) return;
  try{ document.hidden ? keepCtx.suspend() : keepCtx.resume(); }catch(e){}
});
function cleanText(text){ return text.replace(/\(.*?\)/g,"").replace(/ \/ /g,", ").replace(/[—–]/g,",").replace(/\s+/g," ").trim(); }
/* ---------- Reproducción de los audios grabados ----------
   En el ordenador el audio se descarga y decodifica entero en memoria y se reproduce por el
   canal de sonido que ya está abierto (keepCtx): así empieza siempre desde el primer instante.
   En iPhone/iPad se usa el reproductor normal (allí ya funcionaba bien y respeta el modo silencio). */
const bufCache = new Map(); let curSrc = null, playTok = 0, elemRouted = false;
function audioURL(file){ return file.startsWith("data:") ? file : "audio/"+file; }
function getBuffer(file){
  if (bufCache.has(file)) return bufCache.get(file);
  const pr = fetch(audioURL(file)).then(r=>r.arrayBuffer())
    .then(ab => new Promise((res, rej) => keepCtx.decodeAudioData(ab, res, rej)));
  bufCache.set(file, pr); pr.catch(()=>bufCache.delete(file));
  if (bufCache.size > 80) bufCache.delete(bufCache.keys().next().value);
  return pr;
}
function prefetchAudio(texts){
  if (!keepCtx || IS_IOS || S.settings.audio !== "rec") return;
  texts.forEach(t => { if (!t) return; const f = AUDIO_MAP[cleanText(t)]; if (f) getBuffer(f).catch(()=>{}); });
}
function stopAudio(){
  playTok++;
  try{ player.pause(); }catch(e){}
  if (curSrc){ try{ curSrc.stop(); }catch(e){} curSrc = null; }
}
function playElement(file, rate, clean, rateOverride){
  if (keepCtx && !IS_IOS && !elemRouted){
    try{ keepCtx.createMediaElementSource(player).connect(keepCtx.destination); elemRouted = true; }catch(e){}
  }
  player.src = audioURL(file);
  player.playbackRate = rate; player.preservesPitch = true; player.webkitPreservesPitch = true;
  const p = player.play(); if (p && p.catch) p.catch(()=>speakTTS(clean, rateOverride));
}
function speak(text, rateOverride){
  const clean = cleanText(text);
  const file = AUDIO_MAP[clean];
  if (file && S.settings.audio === "rec"){
    try{ speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel(); }catch(e){}
    stopAudio();
    const rate = Math.min(1.15, (rateOverride || S.settings.rate || 0.85) / 0.85);
    if (!keepCtx) keepAudioAwake();
    if (keepCtx && !IS_IOS && Math.abs(rate - 1) < 0.01){
      const tok = playTok;
      getBuffer(file).then(buf => {
        if (tok !== playTok) return;                       // se pulsó otro audio entretanto
        if (keepCtx.state !== "running") keepCtx.resume();
        const src = keepCtx.createBufferSource(); src.buffer = buf; src.connect(keepCtx.destination);
        const warm = Math.max(0, 0.7 - (Date.now() - keepStarted) / 1000); // canal recién abierto
        src.start(keepCtx.currentTime + warm + 0.05); curSrc = src;
      }).catch(() => playElement(file, rate, clean, rateOverride));
      return;
    }
    try{ playElement(file, rate, clean, rateOverride); return; }catch(e){}
  }
  speakTTS(clean, rateOverride);
}
function speakTTS(clean, rateOverride){
  if (!("speechSynthesis" in window)) return toast("Tu navegador no puede leer en voz alta");
  if (!itVoices.length) loadVoices();
  const v = currentVoice();
  window._lastVoice = v ? (v.name+" · "+v.lang) : "ninguna voz italiana (el navegador elige)";
  const go = (voice, retry) => {
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "it-IT"; if (voice) u.voice = voice;
    u.rate = rateOverride || S.settings.rate || 0.85; u.pitch = 1;
    u.onerror = () => {
      // si la voz es online y no hay conexión, prueba con una voz local
      if (retry){ const local = itVoices.find(x=>x.localService && x!==voice); if (local) go(local, false); }
    };
    speechSynthesis.speak(u);
  };
  try{ speechSynthesis.cancel(); go(v, true); }catch(e){ toast("No se pudo reproducir el audio"); }
}

/* =========================================================
   PANTALLA DE INICIO
   ========================================================= */
function renderHome(){
  growSections();
  const now = Date.now(), all = allCards();
  const due = all.filter(c=>isDue(c,now)).length;
  const learned = all.filter(c=>!isNew(c)).length;
  const mastered = all.filter(isMastered).length;
  const secs = SECTIONS.map(s => ({id:s.id,name:s.name,icon:s.icon,total:s.total}));
  const customSecs = [...new Set(S.custom.map(c=>c.sec))].filter(id=>!secs.find(s=>s.id===id));
  customSecs.forEach(id => secs.push({id, name:id, icon:"📝"}));

  $("#app").innerHTML = `
    <header>
      <h1><span class="flag"><i></i><i></i><i></i></span> Italiano</h1>
      <div>
        <button class="icon-btn" title="Añadir palabra" onclick="renderAdd()">＋</button>
        <button class="icon-btn" title="Ajustes" onclick="renderSettings()">⚙︎</button>
      </div>
    </header>
    ${("speechSynthesis" in window) && !itVoices.length && !Object.keys(AUDIO_MAP).length ? `<div class="panel" style="background:var(--amber-soft);border-color:transparent;cursor:pointer" onclick="renderSettings()">
      <b>⚠️ No se encuentra ninguna voz italiana</b>
      <p class="note" style="margin:4px 0 0">El audio puede sonar con acento de otro idioma (por ejemplo «kiu-china» en vez de «cu-CHI-na»). Toca aquí para ver cómo instalar una voz italiana.</p></div>` : ""}
    <div class="stats">
      <div class="stat"><b>${streakNow()}🔥</b><span>días seguidos</span></div>
      <div class="stat"><b>${learned}</b><span>vistas de ${all.length}</span></div>
      <div class="stat"><b>${mastered}</b><span>dominadas</span></div>
    </div>
    <button class="primary" onclick="startSession('all')">
      ${due ? `Repaso del día · ${due} pendiente${due>1?"s":""}` : "Sesión del día (palabras nuevas)"}
    </button>
    <div class="sec" style="cursor:pointer" onclick="renderPron()">
      <div class="sec-top">
        <div class="sec-ico">🗣️</div>
        <div><div class="sec-name">Pronunciación</div>
        <div class="sec-meta">Cómo suenan las letras y combinaciones, comparado con el español</div></div>
        <span style="margin-left:auto;color:var(--muted)">›</span>
      </div>
    </div>
    ${secs.map(s=>{
      const cs = cardsOf(s.id); const d = cs.filter(c=>isDue(c,now)).length;
      const m = cs.filter(isMastered).length; const seen = cs.filter(c=>!isNew(c)).length;
      const pct = cs.length ? Math.round(m/cs.length*100) : 0;
      return `<div class="sec">
        <div class="sec-top">
          <div class="sec-ico">${s.icon}</div>
          <div><div class="sec-name">${esc(s.name)}</div>
          <div class="sec-meta">${seen} vistas · ${m} dominadas · ${cs.length}${s.total>cs.length?` de ${s.total}`:""} desbloqueadas</div></div>
          ${d?`<span class="due-pill">${d} por repasar</span>`:""}
        </div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="sec-btns">
          <button class="go" onclick="startSession('${s.id}')">Estudiar</button>
          <button onclick="startSession('${s.id}', true)">Repaso libre</button>
        </div>
      </div>`;
    }).join("")}
    <p class="note">Tu progreso se guarda en este dispositivo y funciona sin conexión. «Estudiar» sigue la repetición espaciada (te muestra lo que toca hoy + palabras nuevas). Cuando has visto todas las palabras de una sección, se le añaden ${GROW_STEP} nuevas solas. «Repaso libre» te da 20 tarjetas, sobre todo las que más te cuestan, sin cambiar tu calendario.</p>
  `;
}

/* =========================================================
   SESIÓN DE ESTUDIO
   ========================================================= */
let Q = [], qi = 0, flipped = false, free = false, sessTotal = 0, sessSec = "all", answered = 0;

/* Peso para el repaso libre: las que fallas y las poco aprendidas salen mucho; las dominadas, muy poco */
function difficulty(c){
  const p = S.progress[c.id]; if (!p) return 0;
  const byBox = [6, 8, 5, 3, 1.5, 0.4, 0.15][Math.min(p.box, 6)];
  return byBox * (1 + Math.min(p.lapses||0, 6) * 0.5);
}
function weightedPick(cs, n){
  const pool = cs.filter(c=>difficulty(c)>0), out = [];
  while (out.length < n && pool.length){
    const tot = pool.reduce((a,c)=>a+difficulty(c), 0); let r = Math.random()*tot, i = 0;
    for (; i < pool.length-1; i++){ r -= difficulty(pool[i]); if (r <= 0) break; }
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function startSession(secId, freeMode=false){
  if (!freeMode) growSections();
  const now = Date.now(); const cs = cardsOf(secId);
  free = freeMode; sessSec = secId;
  if (free){
    Q = weightedPick(cs, 20);
    if (!Q.length) return toast("Primero estudia algunas palabras de esta sección con «Estudiar»");
  }
  else {
    const due = shuffle(cs.filter(c=>isDue(c,now)));
    const nw = shuffle(cs.filter(isNew)).slice(0, S.settings.newPerSession);
    Q = due.concat(nw);
  }
  if (!Q.length){
    const next = cs.filter(c=>!isNew(c)).map(c=>S.progress[c.id].due).sort((a,b)=>a-b)[0];
    const days = next ? Math.max(1, Math.ceil((next-now)/DAY)) : null;
    $("#app").innerHTML = `<div class="done"><div class="big">🎉</div><h2>¡Todo al día!</h2>
      <p class="note">${days?`Próximo repaso en ${days} día${days>1?"s":""}.`:"Has visto todas las palabras."} Puedes hacer un «Repaso libre» cuando quieras.</p>
      <button class="ghost" onclick="startSession('${secId}', true)">Repaso libre</button>
      <button class="ghost" onclick="renderHome()">Volver</button></div>`;
    return;
  }
  qi = 0; answered = 0; sessTotal = Q.length; flipped = false;
  renderCard();
}

function cardDir(c){
  const d = S.settings.dir;
  if (d==="mix"){ c._dir ??= Math.random()<.5 ? "it-es" : "es-it"; return c._dir; }
  return d;
}

function renderCard(){
  if (qi >= Q.length){ return renderDone(); }
  const c = Q[qi];
  prefetchAudio([c.it, c.exIt, Q[qi+1] && Q[qi+1].it, Q[qi+1] && Q[qi+1].exIt]); const dir = cardDir(c); const p = S.progress[c.id];
  const front = dir==="it-es" ? c.it : c.es;
  const back = dir==="it-es" ? c.es : c.it;
  const secName = (SECTIONS.find(s=>s.id===c.sec)||{name:c.sec}).name;
  const pct = Math.round(answered/Math.max(sessTotal,1)*100);
  $("#app").innerHTML = `
    <div class="topbar">
      <button class="icon-btn" onclick="renderHome()">✕</button>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <span class="counter">${Math.min(answered+1, sessTotal)}/${sessTotal}</span>
    </div>
    <div class="flash" onclick="flip()">
      <span class="tag">${esc(secName)} · ${dir==="it-es"?"IT → ES":"ES → IT"}${free?" · libre":""}</span>
      <span class="box">${p?("Nivel "+Math.min(p.box,6)+"/6"):"Nueva"}</span>
      <div class="front">${esc(front)}</div>
      ${(dir==="it-es" || flipped) ? `<button class="speak" onclick="event.stopPropagation();speak(${esc(JSON.stringify(c.it))})">🔊 Escuchar palabra</button>`:""}
      ${!flipped ? `<div class="hint">Toca para ver la respuesta</div>` : `
        <div class="back">${esc(back)}</div>
        ${c.exIt?`<div class="ex"><div class="it">${esc(c.exIt)}</div><div class="es">${esc(c.exEs)}</div>
          <button class="speak" onclick="event.stopPropagation();speak(${esc(JSON.stringify(c.exIt))})">🔊 Escuchar frase</button></div>`:""}
      `}
    </div>
    <div class="answers ${flipped?"":"hidden"}">
      <button class="a-again" onclick="answer(0)">Otra vez<small>no la sabía</small></button>
      <button class="a-good" onclick="answer(1)">Bien<small>me costó</small></button>
      <button class="a-easy" onclick="answer(2)">Fácil<small>la sabía</small></button>
    </div>
    ${!flipped?`<p class="note" style="text-align:center">Atajos: espacio = girar · 1 / 2 / 3 = responder</p>`:""}
  `;
}

function flip(){ if (!flipped){ flipped = true; renderCard(); } }

function answer(q){
  const c = Q[qi]; const now = Date.now();
  if (free && q===0 && S.progress[c.id]){ const p = S.progress[c.id]; p.lapses = (p.lapses||0)+1; save(); }
  if (!free){
    const p = S.progress[c.id] || {box:0, due:now, seen:0};
    if (q===0){ p.box = 1; if (p.seen) p.lapses = (p.lapses||0)+1; }
    else if (q===1){ p.box = Math.min(6, Math.max(2, p.box+1)); }
    else { p.box = Math.min(6, Math.max(3, p.box+2)); }
    p.due = now + INTERVALS[p.box]*DAY; p.seen = (p.seen||0)+1;
    S.progress[c.id] = p; bumpStreak(); save();
  }
  if (q===0){
    // vuelve a aparecer unas tarjetas más adelante en esta misma sesión
    const pos = Math.min(Q.length, qi+4);
    Q.splice(pos, 0, c);
  } else { answered++; }
  qi++; flipped = false; renderCard();
}

function renderDone(){
  if (free){ bumpStreak(); save(); }
  $("#app").innerHTML = `<div class="done"><div class="big">✅</div><h2>¡Sesión completada!</h2>
    <p class="note">${sessTotal} palabras repasadas. Racha: ${streakNow()} 🔥</p>
    <button class="primary" onclick="renderHome()">Volver al inicio</button>
    <button class="ghost" onclick="startSession('${sessSec}', true)">Otro repaso libre</button></div>`;
}

document.addEventListener("keydown", e=>{
  if (!Q.length || qi>=Q.length || !$(".flash")) return;
  if (e.code==="Space"){ e.preventDefault(); flip(); }
  if (flipped && ["1","2","3"].includes(e.key)) answer(+e.key-1);
});

function delCustom(i){ const c=S.custom[i]; delete S.progress[c.id]; S.custom.splice(i,1); save(); renderAdd(); }

function testVoice(i){

function useVoice(i){ const v = itVoices[i]; if (!v) return; S.settings.voice = v.voiceURI; save(); toast("Voz elegida: "+v.name); renderSettings(); }
function setS(k,v){ S.settings[k]=v; save(); renderSettings(); }
function exportData(){
  const txt = JSON.stringify(S);
  const box = $("#exp-box"); box.classList.remove("hidden"); $("#exp-txt").value = txt;
  try{
    navigator.clipboard.writeText(txt).then(()=>toast("Progreso copiado ✓ Pégalo en la otra versión"), ()=>toast("Copia el texto manualmente"));
  }catch(e){ toast("Copia el texto manualmente"); }
  try{ // en el archivo descargado también intenta guardar un .json
    if (location.protocol==="file:"){
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:"application/json"}));
      a.download = "progreso-italiano-"+todayStr()+".json"; a.click();
    }
  }catch(e){}
}
function importText(){
  try{ const d = JSON.parse($("#imp-txt").value); if(!d.progress) throw 0; S = d; save(); toast("Progreso importado ✓"); renderHome(); }
  catch(e){ toast("Texto no válido"); }
}
function importData(f){
  if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.progress) throw 0; S = d; save(); toast("Progreso importado ✓"); renderHome(); }catch(e){ toast("Archivo no válido"); } };
  r.readAsText(f);
}
function resetAll(){
  const b = document.querySelector(".danger");
  if (b.dataset.confirm){ S.progress={}; S.streak={last:null,count:0}; save(); toast("Progreso borrado"); renderHome(); }
  else { b.dataset.confirm = 1; b.textContent = "Pulsa otra vez para confirmar"; }
}

/* ---------- App instalable: funciona sin conexión y se actualiza sola ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const showUpdate = w => {
      if ($(".update-bar")) return;
      const bar = document.createElement("div"); bar.className = "update-bar";
      bar.innerHTML = `<span>Hay una versión nueva de la app.</span><button>Actualizar</button>`;
      bar.querySelector("button").onclick = () => w.postMessage("skipWaiting");
      document.body.appendChild(bar);
    };
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener("updatefound", ()=>{
      const w = reg.installing;
      w.addEventListener("statechange", ()=>{ if (w.state==="installed" && navigator.serviceWorker.controller) showUpdate(w); });
    });
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if (!reloaded){ reloaded = true; location.reload(); } });
}
